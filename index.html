<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>즐거운 밸런스 게임</title>
    <style>
        /* [디자인 설정] 전체 스타일 적용 */
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Pretendard', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
        }

        body {
            background-color: #f8fafc;
            color: #1e293b;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 16px;
        }

        .container {
            width: 100%;
            max-width: 600px;
            background-color: #ffffff;
            border-radius: 20px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.08);
            padding: 24px;
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        /* 헤더 스타일 */
        .header {
            text-align: center;
        }

        .title {
            font-size: 1.8rem;
            font-weight: 800;
            color: #0f172a;
            margin-bottom: 6px;
        }

        .progress-text {
            font-size: 1rem;
            color: #64748b;
            font-weight: 600;
        }

        /* 밸런스 선택지 카드 영역 */
        .game-area {
            display: flex;
            flex-direction: column;
            gap: 16px;
        }

        @media (min-width: 640px) {
            .game-area {
                flex-direction: row;
            }
        }

        .option-card {
            flex: 1;
            padding: 28px 20px;
            border-radius: 16px;
            border: 4px solid transparent;
            cursor: pointer;
            transition: all 0.2s ease;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center;
            min-height: 180px;
            position: relative;
            user-select: none;
        }

        /* A 선택지 - 파란색 계열 */
        .option-a {
            background-color: #eff6ff;
            color: #1e40af;
            border-color: #bfdbfe;
        }

        .option-a:hover {
            background-color: #dbeafe;
            transform: translateY(-2px);
        }

        .option-a.selected {
            background-color: #2563eb;
            color: #ffffff;
            border-color: #1d4ed8;
            box-shadow: 0 8px 16px rgba(37, 99, 235, 0.3);
        }

        /* B 선택지 - 주황색 계열 */
        .option-b {
            background-color: #fff7ed;
            color: #c2410c;
            border-color: #fed7aa;
        }

        .option-b:hover {
            background-color: #ffedd5;
            transform: translateY(-2px);
        }

        .option-b.selected {
            background-color: #ea580c;
            color: #ffffff;
            border-color: #c2410c;
            box-shadow: 0 8px 16px rgba(234, 88, 12, 0.3);
        }

        .badge {
            font-size: 1.2rem;
            font-weight: 900;
            margin-bottom: 12px;
            padding: 4px 12px;
            border-radius: 20px;
            background-color: rgba(255, 255, 255, 0.6);
        }

        .option-a.selected .badge, .option-b.selected .badge {
            background-color: rgba(255, 255, 255, 0.25);
        }

        .option-text {
            font-size: 1.25rem;
            font-weight: 700;
            line-height: 1.4;
            word-break: keep-all;
        }

        /* 버튼 스타일 */
        .btn {
            width: 100%;
            padding: 16px;
            font-size: 1.1rem;
            font-weight: 700;
            border: none;
            border-radius: 12px;
            cursor: pointer;
            transition: background-color 0.2s, transform 0.1s;
        }

        .btn:active {
            transform: scale(0.98);
        }

        .btn-primary {
            background-color: #0f172a;
            color: #ffffff;
        }

        .btn-primary:hover {
            background-color: #334155;
        }

        .btn-primary:disabled {
            background-color: #cbd5e1;
            cursor: not-allowed;
            transform: none;
        }

        .btn-secondary {
            background-color: #f1f5f9;
            color: #475569;
            border: 1px solid #e2e8f0;
        }

        .btn-secondary:hover {
            background-color: #e2e8f0;
        }

        /* 커스텀 질문 추가 영역 */
        .add-question-section {
            margin-top: 10px;
            padding-top: 20px;
            border-top: 2px dashed #e2e8f0;
        }

        .add-title {
            font-size: 1rem;
            font-weight: 700;
            color: #475569;
            margin-bottom: 10px;
        }

        .input-group {
            display: flex;
            flex-direction: column;
            gap: 8px;
            margin-bottom: 10px;
        }

        .input-field {
            width: 100%;
            padding: 10px 14px;
            border: 1px solid #cbd5e1;
            border-radius: 8px;
            font-size: 0.95rem;
            outline: none;
        }

        .input-field:focus {
            border-color: #2563eb;
            box-shadow: 0 0 0 2px rgba(37, 99, 235, 0.2);
        }

        /* 결과 화면 스타일 */
        .result-list {
            display: flex;
            flex-direction: column;
            gap: 12px;
            max-height: 400px;
            overflow-y: auto;
            padding-right: 4px;
        }

        .result-item {
            background-color: #f8fafc;
            border: 1px solid #e2e8f0;
            border-radius: 12px;
            padding: 14px;
            display: flex;
            flex-direction: column;
            gap: 6px;
        }

        .result-q-num {
            font-size: 0.85rem;
            font-weight: 700;
            color: #64748b;
        }

        .result-choice {
            font-size: 1.05rem;
            font-weight: 700;
            padding: 8px 12px;
            border-radius: 8px;
            display: inline-block;
        }

        .result-choice.choice-a {
            background-color: #dbeafe;
            color: #1e40af;
        }

        .result-choice.choice-b {
            background-color: #ffedd5;
            color: #c2410c;
        }

        .hidden {
            display: none !important;
        }
    </style>
</head>
<body>

<div class="container">
    <!-- 메인 게임 화면 -->
    <div id="game-screen">
        <div class="header">
            <h1 class="title">⚖️ 밸런스 게임</h1>
            <p id="progress" class="progress-text">질문 1 / 10</p>
        </div>

        <div style="margin-top: 20px;">
            <div class="game-area">
                <div id="card-a" class="option-card option-a" onclick="selectOption('A')">
                    <div class="badge">A</div>
                    <div id="text-a" class="option-text">선택지 A</div>
                </div>
                <div id="card-b" class="option-card option-b" onclick="selectOption('B')">
                    <div class="badge">B</div>
                    <div id="text-b" class="option-text">선택지 B</div>
                </div>
            </div>
        </div>

        <button id="next-btn" class="btn btn-primary" style="margin-top: 20px;" onclick="nextQuestion()" disabled>
            선택해주세요
        </button>

        <!-- 나만의 질문 추가 기능 -->
        <div class="add-question-section">
            <div class="add-title">➕ 내가 만든 질문 추가하기</div>
            <div class="input-group">
                <input type="text" id="custom-a" class="input-field" placeholder="선택지 A 입력 (예: 평생 에어컨 없이 살기)">
                <input type="text" id="custom-b" class="input-field" placeholder="선택지 B 입력 (예: 평생 히터 없이 살기)">
            </div>
            <button class="btn btn-secondary" onclick="addCustomQuestion()">질문 목록에 추가하기</button>
        </div>
    </div>

    <!-- 결과 화면 -->
    <div id="result-screen" class="hidden">
        <div class="header">
            <h1 class="title">🎉 선택 결과 한눈에 보기</h1>
            <p class="progress-text">내가 선택한 밸런스게임 결과입니다!</p>
        </div>

        <div id="result-container" class="result-list" style="margin-top: 20px;">
            <!-- 결과 항목들이 여기에 동적으로 생성됩니다 -->
        </div>

        <button class="btn btn-primary" style="margin-top: 20px;" onclick="restartGame()">
            🔄 다시 하기 (질문 섞기)
        </button>
    </div>
</div>

<script>
    /* 
     ================================================================
     [★ 초보자 안내 ★] 질문을 수정/추가하고 싶다면 아래 배열을 고치세요!
     - 'a': 왼쪽 파란색 선택지
     - 'b': 오른쪽 주황색 선택지
     ================================================================
    */
    const defaultQuestions = [
        { a: "평생 치킨만 먹기", b: "평생 피자만 먹기" },
        { a: "10년 전으로 돌아가기", b: "10년 후로 미래 가기" },
        { a: "자도 자도 피곤한 상태", b: "배불러도 계속 배고픈 상태" },
        { a: "여름에 겨울 옷 입기", b: "겨울에 여름 옷 입기" },
        { a: "모든 사람의 속마음 들리기", b: "내 속마음이 전 세계에 방송되기" },
        { a: "평생 스마트폰 없이 살기", b: "평생 친구 없이 살기" },
        { a: "월 200만원 벌며 매일 놀기", b: "월 1000만원 벌며 일만 하기" },
        { a: "소고기 무한리필", b: "회/초밥 무한리필" },
        { a: "과거를 바꿀 수 있는 능력", b: "미래를 볼 수 있는 능력" },
        { a: "초능력 하나 갖기 (비행)", b: "초능력 하나 갖기 (순간이동)" }
    ];

    // 게임 상태 변수
    let questions = [];
    let currentIndex = 0;
    let selectedAnswer = null;
    let userAnswers = [];

    // 배열 섞기 함수 (랜덤 출력용)
    function shuffleArray(array) {
        const shuffled = [...array];
        for (let i = shuffled.length - 1; i > 0; i--) {
            const j = Math.floor(Math.random() * (i + 1));
            [shuffled[i], shuffled[j]] = [shuffled[j], shuffled[i]];
        }
        return shuffled;
    }

    // 게임 시작 및 초기화
    function initGame() {
        questions = shuffleArray(defaultQuestions);
        currentIndex = 0;
        selectedAnswer = null;
        userAnswers = [];

        document.getElementById('game-screen').classList.remove('hidden');
        document.getElementById('result-screen').classList.add('hidden');

        showQuestion();
    }

    // 현재 질문 화면에 표시
    function showQuestion() {
        selectedAnswer = null;
        const currentQ = questions[currentIndex];

        document.getElementById('progress').innerText = `질문 ${currentIndex + 1} / ${questions.length}`;
        document.getElementById('text-a').innerText = currentQ.a;
        document.getElementById('text-b').innerText = currentQ.b;

        // 선택 스타일 초기화
        document.getElementById('card-a').classList.remove('selected');
        document.getElementById('card-b').classList.remove('selected');

        // 버튼 상태 변경
        const nextBtn = document.getElementById('next-btn');
        nextBtn.disabled = true;
        nextBtn.innerText = "선택해주세요";
    }

    // 선택지 클릭 처리
    function selectOption(option) {
        selectedAnswer = option;
        const cardA = document.getElementById('card-a');
        const cardB = document.getElementById('card-b');
        const nextBtn = document.getElementById('next-btn');

        if (option === 'A') {
            cardA.classList.add('selected');
            cardB.classList.remove('selected');
        } else {
            cardB.classList.add('selected');
            cardA.classList.remove('selected');
        }

        nextBtn.disabled = false;
        if (currentIndex === questions.length - 1) {
            nextBtn.innerText = "결과 보기 🏆";
        } else {
            nextBtn.innerText = "다음 질문 ➡️";
        }
    }

    // 다음 질문으로 이동
    function nextQuestion() {
        if (!selectedAnswer) return;

        // 사용자 선택 저장
        const currentQ = questions[currentIndex];
        const chosenText = selectedAnswer === 'A' ? currentQ.a : currentQ.b;
        
        userAnswers.push({
            questionNum: currentIndex + 1,
            choice: selectedAnswer,
            text: chosenText,
            optionA: currentQ.a,
            optionB: currentQ.b
        });

        currentIndex++;

        if (currentIndex < questions.length) {
            showQuestion();
        } else {
            showResults();
        }
    }

    // 결과 화면 보여주기
    function showResults() {
        document.getElementById('game-screen').classList.add('hidden');
        document.getElementById('result-screen').classList.remove('hidden');

        const container = document.getElementById('result-container');
        container.innerHTML = '';

        userAnswers.forEach((ans) => {
            const item = document.createElement('div');
            item.className = 'result-item';

            const qNum = document.createElement('div');
            qNum.className = 'result-q-num';
            qNum.innerText = `Q${ans.questionNum}. [A] ${ans.optionA} vs [B] ${ans.optionB}`;

            const choice = document.createElement('div');
            choice.className = `result-choice ${ans.choice === 'A' ? 'choice-a' : 'choice-b'}`;
            choice.innerText = `👉 나의 선택: (${ans.choice}) ${ans.text}`;

            item.appendChild(qNum);
            item.appendChild(choice);
            container.appendChild(item);
        });
    }

    // 나만의 질문 추가하기
    function addCustomQuestion() {
        const inputA = document.getElementById('custom-a');
        const inputB = document.getElementById('custom-b');

        const textA = inputA.value.trim();
        const textB = inputB.value.trim();

        if (!textA || !textB) {
            alert('A와 B 선택지 내용을 모두 입력해주세요!');
            return;
        }

        // 질문 추가
        defaultQuestions.push({ a: textA, b: textB });
        
        // 현재 질문 목록에도 추가
        questions.push({ a: textA, b: textB });

        // 입력창 비우기
        inputA.value = '';
        inputB.value = '';

        // 진행도 업데이트
        document.getElementById('progress').innerText = `질문 ${currentIndex + 1} / ${questions.length}`;

        alert('새 질문이 성공적으로 추가되었습니다!');
    }

    // 게임 다시 시작
    function restartGame() {
        initGame();
    }

    // 페이지 로드 시 게임 자동 시작
    window.onload = function() {
        initGame();
    };
</script>
</body>
</html>
